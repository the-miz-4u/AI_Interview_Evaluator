<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Insight | Next-Gen Evaluator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2.5rem; font-weight: 700; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: #94a3b8; margin-top: 10px; }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }

        label { display: block; margin-bottom: 10px; font-weight: 600; color: #cbd5e1; font-size: 0.9rem; }
        
        textarea, input[type="file"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 12px;
            color: white;
            outline: none;
        }

        textarea { height: 120px; resize: none; }

        .btn-evaluate {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }
        .btn-evaluate:hover { opacity: 0.9; transform: scale(1.01); }

        /* Results Styling */
        #result-box { display: none; margin-top: 40px; animation: fadeIn 0.5s ease; }
        
        .score-container { display: flex; justify-content: space-between; gap: 15px; margin-top: 20px; }
        .score-tile {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
        }
        .score-val { font-size: 2rem; font-weight: 800; display: block; color: #fbbf24; }
        .score-label { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

        .loading-overlay {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        /* Animated Circular Gauges */
        .circular-progress {
            position: relative;
            height: 120px;
            width: 120px;
            border-radius: 50%;
            background: conic-gradient(rgba(255,255,255,0.1) 360deg, rgba(255,255,255,0.1) 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .circular-progress::before {
            content: "";
            position: absolute;
            height: 100px;
            width: 100px;
            border-radius: 50%;
            background-color: var(--bg);
        }
        .circular-progress .score-val {
            position: relative;
        }

        /* AI Processing Loading State */
        .ai-loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }
        .ai-brain {
            font-size: 5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse-glow 1.5s infinite alternate;
            position: relative;
            z-index: 2;
        }
        .scanner-beam {
            position: absolute;
            width: 120px;
            height: 4px;
            background: #a855f7;
            box-shadow: 0 0 15px 5px rgba(168, 85, 247, 0.6);
            border-radius: 50%;
            animation: scan-vertical 2s ease-in-out infinite;
            z-index: 3;
        }
        .loading-text {
            margin-top: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.95); filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.4)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 35px rgba(168, 85, 247, 0.9)); }
        }
        @keyframes scan-vertical {
            0% { top: 20%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 70%; opacity: 0; }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) { .input-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <h1><i class="fas fa-brain"></i> AI Interview Insight</h1>
        <p>Advanced Multimodal Assessment for Engineers</p>
    </header>

    <div class="input-grid">
        <div class="card">
            <label><i class="fas fa-file-alt"></i> Job Description</label>
            <textarea id="jobDescription" placeholder="Paste the JD here..."></textarea>
        </div>
        <div class="card" style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label><i class="fas fa-user-tie"></i> Upload Resume (PDF/DOCX)</label>
                <input type="file" id="resumeFile">
            </div>
            <div>
                <label><i class="fas fa-video"></i> Upload Interview Video</label>
                <input type="file" id="videoFile" accept="video/*">
            </div>
        </div>
    </div>

    <button class="btn-evaluate" onclick="startEvaluation()">
        <i class="fas fa-bolt"></i> RUN AI EVALUATION
    </button>

    <div id="loading" class="loading-overlay" style="display: none;">
        <div class="ai-loader-container">
            <i class="fas fa-brain ai-brain"></i>
            <div class="scanner-beam"></div>
            <p class="loading-text" id="dynamic-loading-text">Initializing AI Engine...</p>
        </div>
    </div>

    <div id="result-box">
        <div class="score-container">
            <div class="score-tile">
                <div class="circular-progress" id="res-progress">
                    <span class="score-val" id="res-score">0%</span>
                </div>
                <span class="score-label">Resume Match</span>
            </div>
            <div class="score-tile">
                <div class="circular-progress" id="tech-progress">
                    <span class="score-val" id="tech-score">0%</span>
                </div>
                <span class="score-label">Technical</span>
            </div>
            <div class="score-tile">
                <div class="circular-progress" id="conf-progress">
                    <span class="score-val" id="conf-score">0%</span>
                </div>
                <span class="score-label">Confidence</span>
            </div>
        </div>
        
        <div style="text-align: center; margin: 25px 0;">
            <h3 style="color: #94a3b8; font-size: 1rem; margin-bottom: 10px;">Final Verdict</h3>
            <span id="hiring-badge" style="padding: 10px 25px; border-radius: 50px; font-weight: 800; font-size: 1.2rem; background: rgba(255,255,255,0.1); border: 2px solid white; transition: all 0.3s ease;">
                Pending...
            </span>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h4 style="color: var(--secondary); margin-bottom: 10px;"><i class="fas fa-comment-dots"></i> AI Feedback</h4>
            <p id="ai-feedback" style="line-height: 1.6; color: #cbd5e1;"></p>
        </div>
        
        <div class="card" style="margin-top: 15px;">
            <p><b>✅ Matched Skills:</b> <span id="matched-skills" style="color: #4ade80;"></span></p>
            <p><b>❌ Missing Skills:</b> <span id="missing-skills" style="color: #f87171;"></span></p>
        </div>

        <div class="card" style="margin-top: 15px; border-color: #f59e0b;">
            <h4 style="color: #fbbf24; margin-bottom: 10px;"><i class="fas fa-question-circle"></i> Suggested Interview Questions</h4>
            <ul id="recommended-questions" style="padding-left: 20px; color: #cbd5e1; line-height: 1.8;">
                </ul>
        </div>
    </div>
</div>

<script>
    // Animation Function
    function animateGauge(elementId, progressId, targetValue, color) {
        let progressElement = document.getElementById(progressId);
        let valueElement = document.getElementById(elementId);
        let progressValue = 0;
        let speed = 20; // Animation speed in milliseconds

        if (targetValue === 0) {
            valueElement.innerText = `0%`;
            return;
        }

        let progress = setInterval(() => {
            progressValue++;
            valueElement.innerText = `${progressValue}%`;
            progressElement.style.background = `conic-gradient(${color} ${progressValue * 3.6}deg, rgba(255,255,255,0.05) 0deg)`;

            if (progressValue >= targetValue) {
                clearInterval(progress);
            }
        }, speed);
    }
    
    // Global variable timer ke liye
    let loadingInterval; 

    function startEvaluation() {
        const resumeFile = document.getElementById('resumeFile').files[0];
        const jdText = document.getElementById('jobDescription').value;
        const videoFile = document.getElementById('videoFile').files[0];

        if (!resumeFile || !jdText || !videoFile) {
            alert("Bhai, Resume, Job Description aur Video teeno daalna zaroori hai!");
            return;
        }

        // UI Reset
        document.getElementById('result-box').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        // Dynamic Text Changer Logic
        const loadingMessages = [
            "Extracting audio & video frames... 🎥",
            "Analyzing body language & eye contact... 👁️",
            "Running NLP on your Resume... 📄",
            "Cross-matching with Job Description... 🔍",
            "Generating final AI feedback... 🧠"
        ];
        let msgIndex = 0;
        document.getElementById('dynamic-loading-text').innerText = loadingMessages[msgIndex];
        
        loadingInterval = setInterval(() => {
            msgIndex = (msgIndex + 1) % loadingMessages.length;
            document.getElementById('dynamic-loading-text').innerText = loadingMessages[msgIndex];
        }, 2500);

        let formData = new FormData();
        formData.append("resume", resumeFile);
        formData.append("jd", jdText);
        formData.append("video", videoFile);

        fetch('/evaluate', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            clearInterval(loadingInterval);
            document.getElementById('loading').style.display = 'none';
            
            if(data.status === "success") {
                document.getElementById('result-box').style.display = 'block';
                
                // Trigger Animations
                animateGauge('res-score', 'res-progress', data.resume_score, '#3b82f6');
                animateGauge('tech-score', 'tech-progress', data.technical_score, '#10b981');
                animateGauge('conf-score', 'conf-progress', data.confidence_score, '#a855f7');
                
                // Set text fields
                document.getElementById('ai-feedback').innerText = data.video_feedback;
                document.getElementById('matched-skills').innerText = data.matched_keywords.join(', ') || 'None';
                document.getElementById('missing-skills').innerText = data.missing_keywords.join(', ') || 'None';

                // --- NEW LOGIC: Update Hiring Badge ---
                let badge = document.getElementById('hiring-badge');
                // Use default if undefined
                let statusText = data.hiring_status || "Score Processed";
                let statusColor = data.status_color || "#94a3b8"; 
                
                badge.innerText = statusText;
                badge.style.borderColor = statusColor;
                badge.style.color = statusColor;
                badge.style.boxShadow = `0 0 15px ${statusColor}40`; // Soft glow based on status

                // --- NEW LOGIC: Update Recommended Questions ---
                let qList = document.getElementById('recommended-questions');
                qList.innerHTML = ""; // Clear purane questions
                if (data.recommended_questions && data.recommended_questions.length > 0) {
                    data.recommended_questions.forEach(q => {
                        let li = document.createElement('li');
                        li.innerText = q;
                        qList.appendChild(li);
                    });
                } else {
                    let li = document.createElement('li');
                    li.innerText = "No specific follow-up questions generated.";
                    qList.appendChild(li);
                }
                
            } else {
                alert("Error: " + data.message);
            }
        })
        .catch(error => {
            clearInterval(loadingInterval);
            document.getElementById('loading').style.display = 'none';
            console.error('Error:', error);
            alert("Server connection failed!");
        });
    }
</script>

</body>
</html>
