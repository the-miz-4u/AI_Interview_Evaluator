<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Evaluator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .section { margin-bottom: 25px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .btn { display: block; width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .btn:hover { background-color: #0056b3; }
        #result-box { margin-top: 20px; padding: 15px; background: #eef; border-radius: 8px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Multimodal AI Interview Evaluator</h1>
    <p style="text-align: center; color: #666;">Upload candidate details for complete AI analysis.</p>

    <form id="evaluationForm">
        <div class="section">
            <h3>📄 1. Resume Matching (Text AI)</h3>
            <label>Upload Resume (PDF):</label>
            <input type="file" id="resumeFile" accept=".pdf" required>
            <br><br>
            <label>Job Description (Paste JD here):</label><br>
            <textarea id="jobDescription" rows="4" style="width: 100%;" required></textarea>
        </div>

        <div class="section">
            <h3>🎥 2. Interview Recording (Video & Audio AI)</h3>
            <label>Upload Mock Interview Video (MP4):</label>
            <input type="file" id="videoFile" accept="video/mp4" required>
            <p style="font-size: 12px; color: #888;">*AI will extract audio for tone analysis and frames for expression analysis.</p>
        </div>

        <button type="button" class="btn" onclick="startEvaluation()">Run AI Evaluation</button>
    </form>

    <div id="result-box">
        <h3>📊 AI Evaluation Report</h3>
        <p id="ai-response">Processing...</p>
    </div>
</div>

<script>
    function startEvaluation() {
        const resumeFile = document.getElementById('resumeFile').files[0];
        const jdText = document.getElementById('jobDescription').value;

        if (!resumeFile || !jdText) {
            alert("Bhai, pehle Resume aur Job Description toh daal do!");
            return;
        }

        // Show processing status
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('ai-response').innerHTML = "<b>🧠 AI is analyzing the Resume against the JD... Please wait.</b>";

        // FormData prepare karna (Backend bhejne ke liye)
        let formData = new FormData();
        formData.append("resume", resumeFile);
        formData.append("jd", jdText);

        fetch('/evaluate', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                // Formatting the result to show the Explainable AI proof
                let resultHTML = `
                    <h3 style="color: #007bff;">Match Score: ${data.resume_score}%</h3>
                    <p><b>✅ Matched Skills:</b> ${data.matched_keywords.join(', ') || 'None found'}</p>
                    <p><b>❌ Missing Skills:</b> ${data.missing_keywords.join(', ') || 'None'}</p>
                `;
                document.getElementById('ai-response').innerHTML = resultHTML;
            } else {
                document.getElementById('ai-response').innerHTML = `<p style="color: red;">Error: ${data.message}</p>`;
            }
        })
        .catch(error => console.error('Error:', error));
    }
</script>

</body>
</html>
